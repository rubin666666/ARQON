name: Build and publish ARQON
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve installed Playwright version
        id: playwright
        run: |
          node -e "console.log('version=' + require('@playwright/test/package.json').version)" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:app
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: node scripts/check-static.mjs
      - name: Save the exact build for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-site
          path: dist/client
          retention-days: 1
          if-no-files-found: error
      - name: Resolve static output
        id: output
        run: echo "directory=$(cat .pages-output)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.directory }}
  browser-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright-version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-test-site
          path: dist/client
      - name: Point the preview server at the downloaded build
        run: echo "dist/client" > .pages-output
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Save failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.project }}
          path: test-results
          retention-days: 3
          if-no-files-found: ignore
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, browser-tests]
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
